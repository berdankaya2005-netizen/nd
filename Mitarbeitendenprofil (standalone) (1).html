  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"de\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Mitarbeitendenprofil – team neusta<\u002Ftitle>\n\n<style>/* ============================================================\n   team neusta – Mitarbeitendenprofil\n   A4 · Hanken Grotesk · Akzent Lila #8C19F5\n   ============================================================ */\n\n:root{\n  --purple:        #8C19F5;\n  --purple-deep:   #6a0fc4;\n  --purple-tint:   #f3e9fe;\n  --ink:           #262626;\n  --ink-soft:      #595959;\n  --ink-faint:     #8a8a8a;\n  --line:          #e4e4e4;\n  --side-bg:       #f3f2f1;\n  --side-line:     #e2e1df;\n  --paper:         #ffffff;\n\n  --sidebar-w:     63mm;\n  --pad:           12mm;\n\n  --f: Arial, \"Helvetica Neue\", Helvetica, sans-serif;\n}\n\n*{ box-sizing:border-box; }\n\nhtml,body{ margin:0; padding:0; }\n\nbody{\n  font-family:var(--f);\n  color:var(--ink);\n  background:#5c5c66;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  padding:34px 0 64px;\n}\n\n/* ============ TOOLBAR (Screen only) ============ */\n.toolbar{\n  position:fixed; top:0; left:0; right:0; z-index:50;\n  height:54px; display:flex; align-items:center; justify-content:space-between;\n  padding:0 20px;\n  background:rgba(24,24,28,.92); backdrop-filter:blur(10px);\n  color:#fff;\n}\n.tb-brand{ font-size:13px; font-weight:600; letter-spacing:.04em; color:#cfcfd6; }\n.tb-actions{ display:flex; gap:8px; }\n.tb-btn{\n  display:inline-flex; align-items:center; gap:7px;\n  font-family:var(--f); font-size:13px; font-weight:600;\n  color:#fff; background:#34343c; border:1px solid #44444e;\n  padding:8px 13px; border-radius:9px; cursor:pointer;\n  transition:background .15s, border-color .15s;\n}\n.tb-btn:hover{ background:#42424c; }\n.tb-btn svg{ opacity:.85; }\n.tb-btn--ghost{ background:transparent; border-color:#3a3a44; color:#a9a9b3; }\n.tb-btn--ghost:hover{ color:#fff; background:#2c2c34; }\nbody.editing #btnEdit{ background:var(--purple); border-color:var(--purple); }\n\n.edithint{\n  position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:49;\n  display:none; font-size:12px; color:#42424c;\n  background:#fff; border:1px solid var(--line); box-shadow:0 4px 16px rgba(0,0,0,.12);\n  padding:7px 14px; border-radius:99px;\n}\n.edithint b{ color:var(--purple); }\n.edithint .gripdot{ letter-spacing:-2px; }\nbody.editing .edithint{ display:block; }\n\n/* ============ A4 PAGE ============ */\n.page{\n  width:210mm; min-height:297mm; margin:0 auto;\n  background:\n    linear-gradient(to right, var(--side-bg) 0, var(--side-bg) var(--sidebar-w), var(--paper) var(--sidebar-w), var(--paper) 100%);\n  box-shadow:0 12px 44px rgba(0,0,0,.30);\n  position:relative;\n  overflow:hidden;\n}\n\n/* ============ MASTHEAD / BANNER ============ */\n.banner{\n  display:block; width:100%; height:auto;\n}\n\n/* ============ FOOTER ============ */\n.docfoot{\n  position:absolute; left:0; right:0; bottom:0;\n  display:flex; align-items:center; justify-content:flex-end;\n  gap:6mm; padding:4mm var(--pad) 4mm calc(var(--sidebar-w) + 10mm);\n  font-size:8px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;\n  color:var(--ink-faint); border-top:1px solid var(--line);\n}\n.docfoot-r{ color:var(--ink-faint); text-align:right; }\n\n/* ============ LAYOUT ============ */\n.layout{ display:grid; grid-template-columns:var(--sidebar-w) 1fr; align-items:start; }\n\n/* ============ SIDEBAR ============ */\n.sidebar{ padding:0 9mm 14mm var(--pad); }\n.portrait-wrap{ display:flex; justify-content:center; margin-top:-19mm; margin-bottom:7mm; position:relative; z-index:5; }\n.portrait{\n  width:34mm; height:34mm; display:block; background:#fff;\n  border-radius:50%; overflow:hidden;\n  box-shadow:0 0 0 1.4mm #fff, 0 2mm 6mm rgba(0,0,0,.22);\n}\n\n.side-sec{ margin-bottom:7.5mm; position:relative; }\n.side-h{\n  margin:0 0 3.2mm; font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;\n  color:var(--purple); padding-bottom:1.6mm; border-bottom:1px solid var(--side-line);\n}\n\n/* data list (key/value) */\n.datalist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.2mm; }\n.datalist li{ display:grid; grid-template-columns:1fr; gap:.4mm; }\n.dl-k{ font-size:8.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }\n.dl-v{ font-size:11px; font-weight:500; color:var(--ink); line-height:1.3; }\n\n/* stacked list (Ausbildung) */\n.stacklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3mm; }\n.stacklist li{ display:flex; flex-direction:column; gap:.4mm; }\n.st-1{ font-size:11px; font-weight:600; color:var(--ink); line-height:1.3; }\n.st-2{ font-size:9.5px; color:var(--ink-soft); line-height:1.3; }\n\n/* tag list (one line per item) */\n.taglist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2mm; }\n.taglist li{ position:relative; padding-left:3.6mm; font-size:10px; color:var(--ink); line-height:1.35; }\n.taglist li::before{ content:\"\"; position:absolute; left:0; top:.62em; width:3px; height:3px; border-radius:50%; background:var(--purple); }\n\n/* chip list (soft skills) */\n.chiplist{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:1.6mm; }\n.chiplist li{\n  font-size:9.5px; font-weight:600; color:var(--purple-deep); white-space:nowrap;\n  background:var(--purple-tint); border-radius:99px; padding:1.4mm 2.6mm; line-height:1.2;\n}\n\n/* link list */\n.linklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.4mm; }\n.linklist li{ display:flex; flex-direction:column; gap:.3mm; }\n.ln-k{ font-size:8.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }\n.ln-v{ font-size:10px; font-weight:500; color:var(--purple-deep); text-decoration:none; word-break:break-all; line-height:1.3; }\n.ln-v:hover{ text-decoration:underline; }\n\n/* ============ MAIN ============ */\n.main{ padding:7mm var(--pad) 14mm 10mm; }\n\n.identity{ margin-bottom:4mm; }\n.name{ margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1.02; color:var(--ink); }\n.role{ margin:2mm 0 0; font-size:12px; font-weight:600; letter-spacing:.01em; color:var(--purple); }\n.bio{ margin:3mm 0 0; font-size:11.5px; line-height:1.48; color:var(--ink-soft); max-width:62ch; }\n\n/* Quote */\n.quote-sec{ margin-bottom:5mm; }\n.quote{\n  margin:0; padding:4.5mm 6mm; position:relative;\n  background:var(--purple-tint); border-radius:3mm;\n  border-left:3px solid var(--purple);\n}\n.quote-text{ margin:0; font-size:11.5px; font-style:italic; line-height:1.5; color:#3a2a52; }\n.quote-src{ margin-top:2.6mm; font-size:9.5px; font-weight:700; letter-spacing:.04em; color:var(--purple-deep); }\n\n/* Section heading */\n.main-sec{ margin-bottom:5.5mm; position:relative; }\n.main-h{\n  margin:0 0 2.5mm; font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;\n  color:var(--ink); padding-bottom:2mm; position:relative;\n}\n.main-h::after{ content:\"\"; position:absolute; left:0; bottom:0; width:14mm; height:2px; background:var(--purple); border-radius:2px; }\n\n/* spec rows (label + body) */\n.speclist{ display:flex; flex-direction:column; gap:2.8mm; }\n.spec{ display:grid; grid-template-columns:30mm 1fr; gap:4mm; align-items:baseline; }\n.spec-h{ margin:0; font-size:10px; font-weight:700; color:var(--purple-deep); line-height:1.35; }\n.spec-b{ margin:0; font-size:11px; line-height:1.5; color:var(--ink); }\n\n/* projects */\n.projlist{ display:flex; flex-direction:column; gap:5mm; }\n.proj{ position:relative; padding-left:5mm; }\n.proj::before{ content:\"\"; position:absolute; left:0; top:1.4mm; bottom:1.4mm; width:2px; background:var(--line); border-radius:2px; }\n.proj-top{ display:flex; align-items:baseline; justify-content:space-between
